name: Deploy Microservice

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da imagem
        run: |
          docker build -t brucilao/horticontrol-microservice:latest .
          docker push brucilao/horticontrol-microservice:latest

      - name: Deploy via Bastion
        uses: appleboy/ssh-action@v1
        with:
          host: 100.54.117.31
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            ssh -o StrictHostKeyChecking=no -i /home/ubuntu/HortiControl2.0.pem ubuntu@10.0.0.211 "cd ~/backend && docker compose pull && docker compose up -d"
