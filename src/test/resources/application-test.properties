# Perfil usado somente pelo teste de carga do contexto.
#
# O objetivo e verificar o WIRING: se todo bean tem suas dependencias, se as
# @ConfigurationProperties casam com as chaves e se a cadeia de seguranca
# monta. Nao e um teste de integracao com MySQL nem com RabbitMQ.

spring.datasource.url=jdbc:h2:mem:exportacao;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# As migracoes usam sintaxe MySQL (ENGINE=InnoDB), entao ficam de fora aqui.
# Elas sao exercitadas ao subir o servico de verdade.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# O RabbitMQ conecta de forma tardia: o listener registra a tentativa em log
# e segue tentando em segundo plano, sem impedir a subida do contexto.
spring.rabbitmq.host=localhost
spring.rabbitmq.listener.simple.auto-startup=false

# Valores de fachada para as propriedades obrigatorias.
jwt.secret=c2VjcmV0LWNoYXZlLXNlZ3VyYS1ob3J0aWNvbnRyb2wtMjAyNg==
horticontrol.api.chave-interna=chave-de-teste

# O teste de contexto nao deve subir container nenhum: ele verifica wiring.
spring.docker.compose.enabled=false
