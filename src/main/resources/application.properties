spring.application.name=export-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8081}

# ===================== BANCO =====================
# Schema proprio do microsservico. Ele NAO acessa as tabelas de pedido:
# esses dados chegam por HTTP na API principal.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O schema e criado e versionado pelo Flyway, nunca pelo Hibernate.
# ddl-auto=update esconde mudancas de schema dentro do mapeamento e nao
# tem como ser revisado em code review.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===================== RABBITMQ =====================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# A mensagem so e confirmada se o listener retornar sem excecao. Com isso,
# uma falha no meio da geracao devolve a mensagem para retentativa em vez
# de perder a solicitacao.
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# Uma exportacao por vez por instancia: gerar PDF e uso intensivo de CPU
# e memoria, entao paralelismo alto aqui degradaria todas as exportacoes
# ao mesmo tempo. Escala se faz com mais replicas.
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=2
spring.rabbitmq.listener.simple.prefetch=1

# Retentativa com espera crescente: a causa mais comum de falha e a API
# principal momentaneamente indisponivel, que costuma se resolver sozinha.
# Esgotadas as tentativas, a mensagem vai para a dead letter queue.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=20s

# ===================== API PRINCIPAL =====================
horticontrol.api.base-url=${HORTICONTROL_API_URL:http://localhost:8080}
horticontrol.api.chave-interna=${HORTICONTROL_INTERNAL_API_KEY}
horticontrol.api.timeout-de-conexao=5s
horticontrol.api.timeout-de-leitura=30s

# ===================== ENTREGA DO PDF =====================
# O servico NAO armazena os relatorios gerados: o PDF fica em memoria apenas
# entre a geracao e o download, e e descartado assim que o cliente o retira.
# O destino do arquivo e a maquina de quem pediu, e so.
#
# Os dois limites abaixo sao o que impede a memoria de crescer sem controle.
horticontrol.exportacao.entrega.prazo-de-retirada=${EXPORT_PRAZO_RETIRADA:10m}
horticontrol.exportacao.entrega.maximo-aguardando=${EXPORT_MAXIMO_AGUARDANDO:50}

# ===================== MENSAGERIA (nomes) =====================
horticontrol.exportacao.mensageria.exchange=horticontrol.exportacoes
horticontrol.exportacao.mensageria.routing-key=exportacao.pedidos.solicitada
horticontrol.exportacao.mensageria.fila=exportacoes.pedidos.pdf
horticontrol.exportacao.mensageria.exchange-de-erros=horticontrol.exportacoes.dlx
horticontrol.exportacao.mensageria.routing-key-de-erros=exportacao.pedidos.falha
horticontrol.exportacao.mensageria.fila-de-erros=exportacoes.pedidos.pdf.dlq

# ===================== JWT =====================
# Este servico apenas VALIDA o token; quem assina e a API principal.
# Os tres valores precisam ser identicos aos de la.
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:hortcontrol-api}
jwt.audience=${JWT_AUDIENCE:hortcontrol-web}
jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECONDS:30}

# ===================== ACTUATOR =====================
# Apenas health exposto: os demais endpoints revelam configuracao interna.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
