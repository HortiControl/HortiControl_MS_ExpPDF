# ===================== BANCO (DEV) =====================
# Em desenvolvimento o microsservico usa o mesmo banco da API principal,
# para nao exigir a criacao de um schema a parte na maquina de cada pessoa.
#
# Isso NAO significa acoplamento de dominio: o export-service continua sem
# mapear nenhuma tabela de pedido — ele so acrescenta exportacao_pedidos e
# obtem os pedidos por HTTP. Em producao os schemas voltam a ser separados
# (ver application-prod.properties), e a mudanca e so esta URL.
spring.datasource.url=jdbc:mysql://localhost:3306/horticontrol
spring.datasource.username=adm
spring.datasource.password=horticontrol

# O schema ja tem as tabelas da API principal, criadas por ddl-auto.
# Sem baseline, o Flyway recusa migrar um schema nao vazio que nao possui
# historico. Com baseline, ele marca o estado atual como ponto de partida
# e aplica so as migracoes deste servico — sem tocar no que ja existe.
spring.flyway.baseline-on-migrate=true

# A versao do baseline PRECISA ser 0.
#
# O padrao do Flyway e 1, o que marcaria o schema como ja estando na versao 1
# e faria a V1 deste servico ser considerada aplicada — a tabela nunca seria
# criada e a aplicacao falharia depois, na validacao do Hibernate, com um
# "missing table" que nao explica a causa.
spring.flyway.baseline-version=0

spring.jpa.show-sql=true

# ===================== SEGURANCA (DEV) =====================
# HTTP local nao suporta cookie Secure.
horticontrol.seguranca.cookie-seguro=false
horticontrol.seguranca.same-site=Lax
horticontrol.seguranca.origens-permitidas=http://localhost:5173

# ===================== SEGREDOS DE DESENVOLVIMENTO =====================
# Mesmo valor do application-dev.properties da API principal: os dois
# servicos precisam compartilhar a chave para que o token assinado la
# seja aceito aqui.
jwt.secret=${JWT_SECRET:c2VjcmV0LWNoYXZlLXNlZ3VyYS1ob3J0aWNvbnRyb2wtMjAyNg==}

# Chave da chamada servico-a-servico. Precisa bater com
# horticontrol.internal.api-key da API principal.
horticontrol.api.chave-interna=${HORTICONTROL_INTERNAL_API_KEY:chave-interna-dev-horticontrol}

# ===================== DOCKER COMPOSE (somente DEV) =====================
# O Boot sobe o compose.yaml deste repositorio e injeta as credenciais do
# RabbitMQ. Nao e preciso rodar "docker compose up" na mao.
spring.docker.compose.enabled=true
spring.docker.compose.file=compose.yaml

# start_only: sobe se estiver parado, mas NAO derruba ao encerrar a aplicacao.
# Com o padrao (start_and_stop), cada reinicio da aplicacao recriaria o broker
# e as filas — o que atrapalha justamente quando se esta depurando a fila.
spring.docker.compose.lifecycle-management=start_only

# ===================== SWAGGER (somente DEV) =====================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
