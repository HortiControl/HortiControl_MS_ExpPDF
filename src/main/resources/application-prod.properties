# ===================== BANCO (PROD) =====================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

# ===================== SEGURANCA (PROD) =====================
horticontrol.seguranca.cookie-seguro=true

# ATENCAO: o cookie de autenticacao e emitido pela API principal. Para que o
# navegador o envie tambem para este servico, os dois precisam estar sob o
# mesmo site. Em dominios distintos, o cookie nao chega aqui e toda requisicao
# resulta em 401 — nesse cenario, publique o microsservico em um subdominio do
# mesmo dominio da API e use same-site=None com cookie seguro.
horticontrol.seguranca.same-site=${COOKIE_SAME_SITE:None}
horticontrol.seguranca.origens-permitidas=${CORS_ORIGENS}

# ===================== DOCKER COMPOSE DESLIGADO =====================
# Em producao o RabbitMQ e um servico gerenciado, nao um container que a
# aplicacao levanta. As credenciais vem das variaveis de ambiente.
spring.docker.compose.enabled=false

# ===================== SWAGGER DESABILITADO =====================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
